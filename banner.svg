<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">Sistema Acadêmico Colaborativo — PIM UNIP 2025</title>
  <desc id="desc">Banner: fundo com gradiente, ícone geométrico de inteligência artificial e texto do projeto.</desc>
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#6a66f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="240" rx="16" fill="url(#g1)"/>
  <rect width="1200" height="240" rx="16" fill="rgba(255,255,255,0)" />

  <!-- Left: geometric AI icon -->
  <g transform="translate(80,40)" filter="url(#shadow)">
    <!-- hexagon base -->
    <polygon points="0,40 34,0 101,0 135,40 101,80 34,80" fill="rgba(255,255,255,0.14)"/>
    <!-- nodes -->
    <circle cx="30" cy="15" r="6" fill="#fff"/>
    <circle cx="106" cy="15" r="6" fill="#fff"/>
    <circle cx="68" cy="65" r="6" fill="#fff"/>
    <line x1="30" y1="15" x2="68" y2="65" stroke="#fff" stroke-width="2" stroke-opacity="0.9"/>
    <line x1="106" y1="15" x2="68" y2="65" stroke="#fff" stroke-width="2" stroke-opacity="0.9"/>
  </g>

  <!-- Main text -->
  <g transform="translate(260,70)">
    <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="34" fill="#fff">
      Sistema Acadêmico Colaborativo
    </text>
    <text x="0" y="48" font-family="Inter, Arial, sans-serif" font-weight="500" font-size="18" fill="rgba(255,255,255,0.95)">
      Com apoio de Inteligência Artificial — PIM • UNIP • 2025
    </text>
    <!-- small tag -->
    <rect x="-4" y="64" rx="8" ry="8" width="220" height="28" fill="rgba(255,255,255,0.08)"/>
    <text x="8" y="83" font-family="Inter, Arial, sans-serif" font-size="14" fill="#fff">C • Python • Automação • Visualização</text>
  </g>

  <!-- Right accent dots -->
  <g transform="translate(980,40)" opacity="0.9">
    <circle cx="0" cy="0" r="6" fill="#ffffff" opacity="0.12"/>
    <circle cx="18" cy="18" r="6" fill="#ffffff" opacity="0.12"/>
    <circle cx="-18" cy="34" r="6" fill="#ffffff" opacity="0.12"/>
  </g>
</svg>
